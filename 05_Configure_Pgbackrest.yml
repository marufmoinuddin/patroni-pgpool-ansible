---
- name: Configure pgBackRest Server
  hosts: pg_backrest
  become: true
  gather_facts: true
  vars_files:
    - variables.yaml
  vars:
    scope: "{{ patroni_scope }}"
    pgversion: "{{ pg_version }}"
    repo_path: "{{ pgbackrest_repo_path }}"
    data_dir: "{{ '/postgres/data/' ~ pgversion ~ '/' ~ scope if ansible_os_family == 'Debian' else '/var/lib/pgsql/' ~ pgversion ~ '/data/' ~ scope }}"
    ssh_dir: "{{ '/var/lib/postgresql/.ssh' if ansible_os_family == 'Debian' else '/var/lib/pgsql/.ssh' }}"

  tasks:
    - name: Gather facts for all pg_nodes
      setup:
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['pg_nodes'] }}"

    - name: Initialize pg_nodes
      set_fact:
        pg_nodes: []

    - name: Get PostgreSQL node hostnames
      set_fact:
        pg_nodes: "{{ pg_nodes + [{'fqdn': hostvars[item]['ansible_fqdn'] | default(item, true), 'ip': hostvars[item]['ansible_default_ipv4']['address'] | default('unknown', true)}] }}"
      loop: "{{ groups['pg_nodes'] }}"

    - name: Set the cluster name, server name, and stanza name
      set_fact:
        cluster_name: "{{ scope }}"
        srv_name: "{{ inventory_hostname }}"
        stanza_name: "{{ scope }}"

    # Update hosts file with all node entries
    - name: Update hosts file with pgBackRest server
      lineinfile:
        path: /etc/hosts
        regexp: "^\\s*{{ hostvars[srv_name]['ansible_default_ipv4']['address'] }}\\s+{{ srv_name }}(\\s.*)?$"
        line: "{{ hostvars[srv_name]['ansible_default_ipv4']['address'] }} {{ srv_name }}"
        state: present

    - name: Remove PostgreSQL nodes from hosts file
      lineinfile:
        path: /etc/hosts
        regexp: "^\\s*{{ item.ip }}\\s+{{ item.fqdn }}(\\s.*)?$"
        state: absent
      loop: "{{ pg_nodes }}"

    - name: Add PostgreSQL nodes to hosts file
      lineinfile:
        path: /etc/hosts
        regexp: "^\\s*{{ item.ip }}\\s+{{ item.fqdn }}(\\s.*)?$"
        line: "{{ item.ip }} {{ item.fqdn }}"
        state: present
      loop: "{{ pg_nodes }}"

    # Purge existing pgBackRest installation
    - name: Purge existing pgBackRest installation
      package:
        name: percona-pgbackrest
        state: absent
      ignore_errors: true

    - name: Remove existing pgBackRest related dirs and files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/pgbackrest.conf
        - /etc/systemd/system/pgbackrest.service
        - /postgres/pgbackup

    # Install pgBackRest
    - name: Install pgBackRest (Debian/Ubuntu)
      apt:
        name: percona-pgbackrest
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Enable CRB (CodeReady Builder) repo (RHEL/CentOS)
      ansible.builtin.shell: dnf config-manager --set-enabled crb
      when: ansible_os_family == "RedHat"
      changed_when: false
      register: enable_crb
      ignore_errors: true

    - name: Install EPEL repo (provides libssh2 on RHEL/CentOS 9)
      ansible.builtin.dnf:
        name: epel-release
        state: present
        disable_gpg_check: true
      when: ansible_os_family == "RedHat"

    - name: Install libssh2 dependency (RHEL/CentOS)
      ansible.builtin.dnf:
        name: libssh2
        state: present
        disable_gpg_check: true
      when: ansible_os_family == "RedHat"

    - name: Refresh dnf cache after enabling repos (RHEL/CentOS)
      ansible.builtin.dnf:
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Install pgBackRest (RHEL/CentOS)
      dnf:
        name: percona-pgbackrest
        state: present
      when: ansible_os_family == "RedHat"

    # Create repository directory
    - name: Create pgBackRest repository directory
      file:
        path: "{{ repo_path }}"
        state: directory
        mode: '0750'
        owner: postgres
        group: postgres

    # Set up SSH key-based authentication
    - name: Create SSH directory for postgres user
      file:
        path: "{{ ssh_dir }}"
        state: directory
        mode: '0700'
        owner: postgres
        group: postgres

    # Fixed SSH key generation approach
    - name: Generate SSH key pair for pgBackRest server
      shell: |
        sudo -u postgres ssh-keygen -t rsa -b 4096 -f {{ ssh_dir }}/id_rsa -N ""
      args:
        creates: "{{ ssh_dir }}/id_rsa"

    - name: Fix SSH key permissions
      file:
        path: "{{ ssh_dir }}/{{ item }}"
        owner: postgres
        group: postgres
        mode: '0600'  # Private key permission
      loop:
        - id_rsa
        - id_rsa.pub
      become: true

    - name: Get pgBackRest server public key
      command: cat {{ ssh_dir }}/id_rsa.pub
      register: pgbackrest_pubkey
      changed_when: false

    # Create pgBackRest configuration file
    - name: Create pgBackRest configuration file
      copy:
        dest: /etc/pgbackrest.conf
        content: |
          [global]
          
          # Repository configuration
          repo1-path={{ repo_path }}
          repo1-retention-archive-type=full
          repo1-retention-full=1
          
          # Server options
          process-max=12
          log-level-console=info
          log-level-file=info
          start-fast=y
          delta=y
          backup-standby=y
          # Bound protocol reads so a hung client session fails fast.
          protocol-timeout=30
          
          [{{ stanza_name }}]
          {% for node in pg_nodes %}
          pg{{ loop.index }}-host={{ node.fqdn }}
          pg{{ loop.index }}-host-user=postgres
          pg{{ loop.index }}-port=5432
          pg{{ loop.index }}-path={{ data_dir }}
          pg{{ loop.index }}-socket-path=/var/run/postgresql
          {% endfor %}
        owner: postgres
        group: postgres
        mode: '0640'

    # The pgBackRest server TLS daemon is NOT used by this stack: archiving is SSH-based
    # (repo1-host on pg nodes, pg1-host..pgN-host on the backrest node). No unit file is
    # shipped (the top-of-play purge removes any stale one); masking the unit guarantees
    # it can never start, never shows as failed on monitoring, and stays that way on
    # re-runs regardless of any future unit file appearing.
    # NOTE (2026-08-12, Debian-family deploy): the RHEL package ships a real
    # /usr/lib/systemd/system/pgbackrest.service (mask works), but the Debian
    # percona-pgbackrest package ships NO unit at all — `systemd: masked: true`
    # then fails with "Could not find the requested service pgbackrest".
    # Guard the mask on the unit file existing; absence means it can never start.
    - name: Check for pgBackRest server unit file (RHEL ships one, Debian does not)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/pgbackrest.service
        - /usr/lib/systemd/system/pgbackrest.service
        - /lib/systemd/system/pgbackrest.service
      register: pgbackrest_unit_files

    - name: Mask unused pgBackRest server daemon (only if a unit file exists)
      systemd:
        name: pgbackrest
        enabled: no
        state: stopped
        masked: true
      when: pgbackrest_unit_files.results | selectattr('stat.exists', 'equalto', true) | list | length > 0

    # Clear any historical failure state from pre-mask runs (upgrade path) so
    # monitoring sees only "masked", never "failed". Debian ships no unit at
    # all, so reset-failed on it errors "Unit pgbackrest.service not loaded" —
    # only run this where a unit file exists.
    - name: Clear historical pgBackRest failure state
      command: systemctl reset-failed pgbackrest.service
      failed_when: false
      register: pgrst
      changed_when: pgrst.rc != 0
      when: pgbackrest_unit_files.results | selectattr('stat.exists', 'equalto', true) | list | length > 0

- name: Configure PostgreSQL nodes for pgBackRest
  hosts: pg_nodes
  become: true
  vars_files:
    - variables.yaml
  vars:
    scope: "{{ patroni_scope }}"
    pgversion: "{{ pg_version }}"
    data_dir: "{{ '/postgres/data/' ~ pgversion ~ '/' ~ scope if ansible_os_family == 'Debian' else '/var/lib/pgsql/' ~ pgversion ~ '/data/' ~ scope }}"
    ssh_dir: "{{ '/var/lib/postgresql/.ssh' if ansible_os_family == 'Debian' else '/var/lib/pgsql/.ssh' }}"

  tasks:
    - name: Get pgBackRest node IP and hostname
      set_fact:
        backrest_node: "{{ groups['pg_backrest'][0] }}"
        backrest_ip: "{{ hostvars[groups['pg_backrest'][0]]['ansible_default_ipv4']['address'] }}"

    # Update hosts file entries
    - name: Remove existing pgBackRest entries
      lineinfile:
        path: /etc/hosts
        regexp: "^\\s*.*\\s+{{ backrest_node }}(\\s.*)?$"
        state: absent

    - name: Add pgBackRest node to hosts file
      lineinfile:
        path: /etc/hosts
        regexp: "^\\s*{{ backrest_ip }}\\s+{{ backrest_node }}(\\s.*)?$"
        line: "{{ backrest_ip }} {{ backrest_node }}"
        state: present

    - name: Remove existing PostgreSQL node entries
      lineinfile:
        path: /etc/hosts
        regexp: "^\\s*{{ hostvars[item]['ansible_default_ipv4']['address'] }}\\s+{{ hostvars[item]['ansible_fqdn'] }}(\\s.*)?$"
        state: absent
      loop: "{{ groups['pg_nodes'] }}"

    - name: Add all PostgreSQL nodes to hosts file
      lineinfile:
        path: /etc/hosts
        regexp: "^\\s*{{ hostvars[item]['ansible_default_ipv4']['address'] }}\\s+{{ hostvars[item]['ansible_fqdn'] }}(\\s.*)?$"
        line: "{{ hostvars[item]['ansible_default_ipv4']['address'] }} {{ hostvars[item]['ansible_fqdn'] }}"
        state: present
      loop: "{{ groups['pg_nodes'] }}"

    # Purge existing pgBackRest installation
    - name: Purge existing pgBackRest installation
      package:
        name: percona-pgbackrest
        state: absent
      ignore_errors: true

    - name: Remove existing pgBackRest related dirs and files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/pgbackrest.conf
        - /etc/systemd/system/pgbackrest.service
        - /postgres/pgbackup

    # Install pgBackRest
    - name: Install pgBackRest (Debian/Ubuntu)
      apt:
        name: percona-pgbackrest
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Enable CRB (CodeReady Builder) repo (RHEL/CentOS, pg_nodes)
      ansible.builtin.shell: dnf config-manager --set-enabled crb
      when: ansible_os_family == "RedHat"
      changed_when: false
      register: enable_crb
      ignore_errors: true

    - name: Install EPEL repo (provides libssh2 on RHEL/CentOS 9, pg_nodes)
      ansible.builtin.dnf:
        name: epel-release
        state: present
        disable_gpg_check: true
      when: ansible_os_family == "RedHat"

    - name: Install libssh2 dependency (RHEL/CentOS, pg_nodes)
      ansible.builtin.dnf:
        name: libssh2
        state: present
        disable_gpg_check: true
      when: ansible_os_family == "RedHat"

    - name: Refresh dnf cache after enabling repos (RHEL/CentOS, pg_nodes)
      ansible.builtin.dnf:
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Install pgBackRest (RHEL/CentOS)
      dnf:
        name: percona-pgbackrest
        state: present
      when: ansible_os_family == "RedHat"

    # Set up SSH directory and authorized_keys for postgres user
    - name: Create SSH directory for postgres user
      file:
        path: "{{ ssh_dir }}"
        state: directory
        mode: '0700'
        owner: postgres
        group: postgres

    - name: Create authorized_keys file
      file:
        path: "{{ ssh_dir }}/authorized_keys"
        state: touch
        mode: '0600'
        owner: postgres
        group: postgres

    - name: Get pgBackRest server public key
      command: cat {{ ssh_dir }}/id_rsa.pub
      register: pgbackrest_pubkey
      delegate_to: "{{ groups['pg_backrest'][0] }}"
      changed_when: false

    - name: Add pgBackRest server public key to authorized_keys
      lineinfile:
        path: "{{ ssh_dir }}/authorized_keys"
        line: "{{ pgbackrest_pubkey.stdout }}"
        state: present

    # Create pgBackRest configuration
    - name: Create pgBackRest configuration file
      copy:
        dest: /etc/pgbackrest.conf
        content: |
          [global]
          repo1-host={{ groups['pg_backrest'][0] }}
          repo1-host-user=postgres
          
          # General options
          process-max=16
          log-level-console=info
          log-level-file=debug
          # Bound protocol reads so a hung/half-dead SSH session fails fast
          # instead of blocking restore_command (and promotion) for ~31min.
          protocol-timeout=30
          
          [{{ scope }}]
          pg1-path={{ data_dir }}
        owner: postgres
        group: postgres
        mode: '0640'

    # The pgBackRest server TLS daemon is NOT used by this stack: archiving is SSH-based
    # (repo1-host on pg nodes, pg1-host..pgN-host on the backrest node). No unit file is
    # shipped (the top-of-play purge removes any stale one); masking the unit guarantees
    # it can never start, never shows as failed on monitoring, and stays that way on
    # re-runs regardless of any future unit file appearing.
    # NOTE (2026-08-12, Debian-family deploy): the RHEL package ships a real
    # /usr/lib/systemd/system/pgbackrest.service (mask works), but the Debian
    # percona-pgbackrest package ships NO unit at all — `systemd: masked: true`
    # then fails with "Could not find the requested service pgbackrest".
    # Guard the mask on the unit file existing; absence means it can never start.
    - name: Check for pgBackRest server unit file (RHEL ships one, Debian does not)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/pgbackrest.service
        - /usr/lib/systemd/system/pgbackrest.service
        - /lib/systemd/system/pgbackrest.service
      register: pgbackrest_unit_files

    - name: Mask unused pgBackRest server daemon (only if a unit file exists)
      systemd:
        name: pgbackrest
        enabled: no
        state: stopped
        masked: true
      when: pgbackrest_unit_files.results | selectattr('stat.exists', 'equalto', true) | list | length > 0

    # Clear any historical failure state from pre-mask runs (upgrade path) so
    # monitoring sees only "masked", never "failed". Debian ships no unit at
    # all, so reset-failed on it errors "Unit pgbackrest.service not loaded" —
    # only run this where a unit file exists.
    - name: Clear historical pgBackRest failure state
      command: systemctl reset-failed pgbackrest.service
      failed_when: false
      register: pgrst
      changed_when: pgrst.rc != 0
      when: pgbackrest_unit_files.results | selectattr('stat.exists', 'equalto', true) | list | length > 0

    # Set up SSH known_hosts to prevent interactive prompts
    - name: Add pgBackRest host to known_hosts
      shell: |
        sudo -u postgres ssh-keyscan -t rsa {{ groups['pg_backrest'][0] }} >> {{ ssh_dir }}/known_hosts
      args:
        creates: "{{ ssh_dir }}/known_hosts"

    - name: Ensure known_hosts has proper permissions
      file:
        path: "{{ ssh_dir }}/known_hosts"
        owner: postgres
        group: postgres
        mode: '0600'

- name: Update Patroni Configuration for pgBackRest
  hosts: pg_nodes[0]
  become: true
  vars_files:
    - variables.yaml
  vars:
    scope: "{{ patroni_scope }}"
    pgversion: "{{ pg_version }}"
    patroni_config_file: /etc/patroni/patroni.yml
    data_dir: "{{ '/postgres/data/' ~ pgversion ~ '/' ~ scope if ansible_os_family == 'Debian' else '/var/lib/pgsql/' ~ pgversion ~ '/data/' ~ scope }}"

  tasks:
    # Aligned with 03_Configure_Patroni.yml, which ships archive_mode: "off" as
    # the no-pgBackRest default. Running this play re-enables archiving and swaps
    # the commands for pgbackrest archive-push/archive-get (archive_command under
    # postgresql.parameters, restore_command under postgresql.recovery_conf).
    - name: Update Patroni configuration for pgBackRest archiving
      command: >
        patronictl -c {{ patroni_config_file }} edit-config 
        -s postgresql.parameters.archive_mode=on
        -s postgresql.parameters.archive_command="pgbackrest --stanza={{ scope }} archive-push {{ data_dir }}/pg_wal/%f"
        -s postgresql.recovery_conf.restore_command="timeout 60 pgbackrest --config=/etc/pgbackrest.conf --stanza={{ scope }} archive-get %f %p"
        --force
      ignore_errors: yes

    - name: Reload Patroni config
      command: patronictl -c {{ patroni_config_file }} reload {{ scope }} --force
      ignore_errors: yes

- name: Set up SSH Authentication Between PostgreSQL Nodes and pgBackRest Server
  hosts: pg_nodes
  become: true
  vars_files:
    - variables.yaml
  vars:
    ssh_dir: "{{ '/var/lib/postgresql/.ssh' if ansible_os_family == 'Debian' else '/var/lib/pgsql/.ssh' }}"
  tasks:
    # Fixed SSH key generation approach for PostgreSQL nodes
    - name: Generate SSH key pair for PostgreSQL nodes
      shell: |
        if [ ! -f {{ ssh_dir }}/id_rsa ]; then
          sudo -u postgres ssh-keygen -t rsa -b 4096 -f {{ ssh_dir }}/id_rsa -N ""
        fi
      args:
        creates: "{{ ssh_dir }}/id_rsa"

    - name: Fix SSH key permissions
      file:
        path: "{{ ssh_dir }}/{{ item }}"
        owner: postgres
        group: postgres
        mode: '0600'
      loop:
        - id_rsa
        - id_rsa.pub

    - name: Get PostgreSQL node public key
      command: cat {{ ssh_dir }}/id_rsa.pub
      register: pg_node_pubkey
      changed_when: false

    # Same race-guard as in the pg_nodes play: add all keys in ONE delegated
    # run_once task instead of per-node parallel writes to the shared file.
    - name: Add ALL PostgreSQL node public keys to pgBackRest server authorized_keys
      authorized_key:
        user: postgres
        key: "{{ hostvars[item]['pg_node_pubkey'].stdout }}"
        state: present
      delegate_to: "{{ groups['pg_backrest'][0] }}"
      run_once: true
      loop: "{{ groups['pg_nodes'] }}"

    # Set up SSH known_hosts to prevent interactive prompts for each pg_node to backrest server
    - name: Add pgBackRest host to known_hosts
      shell: |
        sudo -u postgres ssh-keyscan -t rsa,ecdsa,ed25519 {{ groups['pg_backrest'][0] }} >> {{ ssh_dir }}/known_hosts
      changed_when: false

    # Same host-key-prompt fix as the pgBackRest node: pgBackRest's internal ssh
    # has no StrictHostKeyChecking control; accept-new prevents a hang when the
    # repo host's key is unknown/changed. Also bound the connection so a
    # half-dead/wedged pgBackRest host fails fast instead of blocking
    # restore_command (and therefore promotion) indefinitely.
    - name: Add ssh config for postgres user (bounded pgBackRest connection)
      copy:
        dest: "{{ ssh_dir }}/config"
        content: |
          Host {{ groups['pg_backrest'][0] }}
              HostName {{ groups['pg_backrest'][0] }}
              ConnectTimeout 10
              ServerAliveInterval 10
              ServerAliveCountMax 3
              BatchMode yes
              StrictHostKeyChecking accept-new
              UserKnownHostsFile ~/.ssh/known_hosts

          Host *
              StrictHostKeyChecking accept-new
              UserKnownHostsFile ~/.ssh/known_hosts
        owner: postgres
        group: postgres
        mode: '0600'

    - name: Ensure known_hosts has proper permissions
      file:
        path: "{{ ssh_dir }}/known_hosts"
        owner: postgres
        group: postgres
        mode: '0600'

    # RHEL/CentOS: SELinux blocks sshd from reading authorized_keys with wrong context.
    # The .ssh dir created via Ansible gets postgresql_db_t; relabel to ssh_home_t.
    - name: Relabel .ssh directory for SELinux (RHEL/CentOS)
      command: restorecon -Rv {{ ssh_dir }}
      changed_when: false
      when: ansible_os_family == "RedHat"

- name: Now start stanza creation
  hosts: pg_backrest
  become: true
  vars_files:
    - variables.yaml
  vars:
    scope: "{{ patroni_scope }}"
    ssh_dir: "{{ '/var/lib/postgresql/.ssh' if ansible_os_family == 'Debian' else '/var/lib/pgsql/.ssh' }}"
  tasks:
    # pgBackRest connects OUT to each DB node; add all pg_node host keys to its known_hosts.
    # Use the .home.local fqdns from pg_nodes (matches pgbackrest.conf pgN-host values).
    # NOTE: must NOT use `creates:` here -- with a loop, the first item creates the file
    # and all subsequent items skip, leaving db2/db3 keys out of known_hosts.
    - name: Add all PostgreSQL node hosts to pgBackRest known_hosts
      shell: |
        sudo -u postgres ssh-keyscan -t rsa,ecdsa,ed25519 {{ item }} >> {{ ssh_dir }}/known_hosts
      loop: "{{ pg_nodes | map(attribute='fqdn') | list }}"
      changed_when: false

    # pgBackRest's internal ssh passes -o PasswordAuthentication=no but NOT
    # StrictHostKeyChecking. On fresh/rebuilt VMs the host key is unknown and ssh
    # blocks waiting for a host-key prompt that never comes under ansible's
    # non-interactive shell. accept-new makes it trust unknown keys silently.
    # Also bound the connection so a half-dead pg node fails fast instead of
    # hanging backups indefinitely.
    - name: Add ssh config for postgres user (bounded pg node connections)
      copy:
        dest: "{{ ssh_dir }}/config"
        content: |
          Host *
              ConnectTimeout 10
              ServerAliveInterval 10
              ServerAliveCountMax 3
              BatchMode yes
              StrictHostKeyChecking accept-new
              UserKnownHostsFile ~/.ssh/known_hosts
        owner: postgres
        group: postgres
        mode: '0600'

    - name: Ensure known_hosts has proper permissions (pgBackRest node)
      file:
        path: "{{ ssh_dir }}/known_hosts"
        owner: postgres
        group: postgres
        mode: '0600'

    # RHEL/CentOS: relabel pgBackRest node's .ssh dir for SELinux
    - name: Relabel .ssh directory for SELinux (pgBackRest node, RHEL/CentOS)
      command: restorecon -Rv {{ ssh_dir }}
      changed_when: false
      when: ansible_os_family == "RedHat"

    - name: Create pgBackRest stanza
      command: sudo -iu postgres pgbackrest --stanza={{ scope }} stanza-create
      changed_when: false
      ignore_errors: yes
      timeout: 120

    - name: Take initial full backup
      command: sudo -iu postgres pgbackrest --stanza={{ scope }} --type=full backup
      changed_when: false
      ignore_errors: yes
      timeout: 300

    - name: Print message for stanza creation
      debug:
        msg: "You need to create the pgBackRest stanza manually by running: sudo -iu postgres pgbackrest --stanza={{ scope }} stanza-create"

    - name: Print message for full backup creation
      debug:
        msg: "After stanza creation, create a full backup manually by running: sudo -iu postgres pgbackrest --stanza={{ scope }} --type=full backup"

    - name: Print message for backup info
      debug:
        msg: "After the backup is complete, check the backup status manually by running: sudo -iu postgres pgbackrest --stanza={{ scope }} info"