---
- name: Configure PostgreSQL and Patroni HA Cluster
  hosts: pg_nodes
  become: true
  gather_facts: true
  vars_files:
    - variables.yaml

  tasks:
    - name: Set OS-specific paths (Debian/Ubuntu)
      set_fact:
        base_data_dir: "/postgres/data/{{ pg_version }}"
        data_dir: "/postgres/data/{{ pg_version }}/{{ patroni_scope }}"
        pg_bin_dir: "/usr/lib/postgresql/{{ pg_version }}/bin"
        pg_socket_dir: "/var/run/postgresql"
        pg_service: "postgresql"
        pg_ctl: "/usr/bin/pg_ctlcluster"
      when: ansible_os_family == "Debian"

    - name: Set OS-specific paths (RHEL/CentOS)
      set_fact:
        base_data_dir: "/var/lib/pgsql/{{ pg_version }}"
        data_dir: "/var/lib/pgsql/{{ pg_version }}/data/{{ patroni_scope }}"
        pg_bin_dir: "/usr/pgsql-{{ pg_version }}/bin"
        pg_socket_dir: "/var/run/postgresql"
        pg_service: "postgresql-{{ pg_version }}"
        pg_ctl: "/usr/pgsql-{{ pg_version }}/bin/pg_ctl"
      when: ansible_os_family == "RedHat"

    # ============================================================
    # RESILIENCE: dcs_namespace alias + etcd member resolution.
    # `dcs_namespace` was previously UNDEFINED (variables.yaml only ships
    # patroni_namespace) - patroni.yml rendered `dcs_namespace: ` empty and the
    # etcd cleanup keys were wrong. Also, Patroni must talk to ALL etcd
    # endpoints (dedicated witness group if configured, else co-located
    # pg_nodes) so DCS access survives a local etcd failure.
    # ============================================================
    - name: Resolve dcs_namespace alias and etcd member hosts
      set_fact:
        dcs_namespace: "{{ dcs_namespace | default(patroni_namespace) }}"
        etcd_member_hosts: "{{ groups[etcd_group] if (etcd_group is defined and etcd_group | length > 0) else groups['pg_nodes'] }}"

    - name: Build ETCD client endpoint list for Patroni (client-side DCS redundancy)
      set_fact:
        etcd_client_endpoints: "{{ etcd_member_hosts | map('extract', hostvars, ['ansible_host']) | map('regex_replace', '^(.*)$', '\\1:2379') | join(',') }}"


    # ============================================================
    # PG TUNE: Calculate optimal PostgreSQL parameters based on VM resources
    # Inspired by https://github.com/le0pard/pgtune
    # ============================================================
    - name: Gather system memory and CPU facts for pgtune calculation
      setup:
        filter: ansible_*memory*,ansible_processor*

    - name: Calculate base values (step 1)
      set_fact:
        # Memory in MB
        total_ram_mb: "{{ ansible_memtotal_mb }}"
        cpu_cores: "{{ ansible_processor_cores | default(ansible_processor_vcpus | default(4)) }}"
        # Map variables.yaml vars to playbook vars
        scope: "{{ patroni_scope }}"
        # Intermediate: cpu * 50 (as integer)
        _cpu50: "{{ (ansible_processor_cores | default(4) * 50) | int }}"

    - name: Calculate memory-based settings (step 2)
      set_fact:
        # pgtune calculations - use ternary/if for min/max to avoid Jinja2 list issues
        pg_shared_buffers_mb: "{{ (ansible_memtotal_mb * 0.25) | int if ((ansible_memtotal_mb * 0.25) | int) < 32768 else 32768 }}"
        pg_effective_cache_size_mb: "{{ (ansible_memtotal_mb * 0.75) | int }}"
        pg_maintenance_work_mem_mb: "{{ 512 if ansible_memtotal_mb <= 4096 else (1024 if ansible_memtotal_mb <= 16384 else 2048) }}"
        # WAL sizes
        pg_min_wal_size_mb: 1024
        pg_max_wal_size_mb: "{{ 4096 if (ansible_memtotal_mb * 0.05 | int) > 4096 else (1024 if (ansible_memtotal_mb * 0.05 | int) < 1024 else (ansible_memtotal_mb * 0.05 | int)) }}"
        # Parallel settings
        pg_max_worker_processes: "{{ ansible_processor_cores | default(4) if ansible_processor_cores | default(4) < 8 else 8 }}"
        pg_max_parallel_workers_per_gather: "{{ (ansible_processor_cores | default(4) // 2) if (ansible_processor_cores | default(4) // 2) < 4 else 4 }}"
        pg_max_parallel_workers: "{{ ansible_processor_cores | default(4) if ansible_processor_cores | default(4) < 8 else 8 }}"

    - name: Calculate max_connections (step 3a - needs _cpu50 from step 1)
      set_fact:
        # max(100, cpu*50) - explicit int casting
        _max100_cpu50: "{{ 100 if (_cpu50 | int) < 100 else (_cpu50 | int) }}"

    - name: Calculate max_connections (step 3b - needs _max100_cpu50 from step 3a)
      set_fact:
        # min(200, max(100, cpu*50)) - explicit int casting
        pg_max_connections: "{{ 200 if (_max100_cpu50 | int) > 200 else (_max100_cpu50 | int) }}"

    - name: Calculate derived parameters (step 4a - needs pg_max_connections, pg_shared_buffers_mb)
      set_fact:
        # work_mem intermediate calculation - explicit int casting
        _work_mem_raw_kb: "{{ (ansible_memtotal_mb * 1024 * 0.25) / ( (pg_max_connections | int) * 2 ) | int }}"
        # wal_buffers: 3% of shared_buffers
        _wal_3pct: "{{ ((pg_shared_buffers_mb | int) * 1024 * 0.03) | int }}"

    - name: Calculate derived parameters (step 4b - needs _wal_3pct, _work_mem_raw_kb from step 4a)
      set_fact:
        # wal_buffers: min(16MB, 3% of shared_buffers) - use ternary to avoid min filter
        pg_wal_buffers_kb: "{{ _wal_3pct if (_wal_3pct | int) < 16384 else 16384 }}"
        # Storage-aware settings (assume SSD for cloud VMs)
        pg_random_page_cost: 1.1
        pg_effective_io_concurrency: 200
        # Checkpoint
        pg_checkpoint_completion_target: 0.9
        # JIT (PG 11+)
        pg_jit: "{{ 'on' if (ansible_processor_cores | default(4)) >= 4 else 'off' }}"

    - name: Calculate work_mem (step 5a - needs _work_mem_raw_kb from step 4b)
      set_fact:
        # work_mem: ensure total work_mem * max_connections * 2 < 25% RAM - use ternary
        _min_work: "{{ 4096 if (_work_mem_raw_kb | int) < 4096 else (_work_mem_raw_kb | int) }}"

    - name: Calculate work_mem (step 5b - needs _min_work from step 5a)
      set_fact:
        pg_work_mem_kb: "{{ 262144 if (_min_work | int) > 262144 else (_min_work | int) }}"

    - name: Display calculated PostgreSQL parameters
      debug:
        msg:
          - "=== PG TUNE CALCULATED PARAMETERS ==="
          - "Total RAM: {{ total_ram_mb }} MB"
          - "CPU Cores: {{ cpu_cores }}"
          - "shared_buffers: {{ pg_shared_buffers_mb }} MB"
          - "effective_cache_size: {{ pg_effective_cache_size_mb }} MB"
          - "maintenance_work_mem: {{ pg_maintenance_work_mem_mb }} MB"
          - "work_mem: {{ pg_work_mem_kb }} kB"
          - "max_connections: {{ pg_max_connections }}"
          - "wal_buffers: {{ pg_wal_buffers_kb }} kB"
          - "min_wal_size: {{ pg_min_wal_size_mb }} MB"
          - "max_wal_size: {{ pg_max_wal_size_mb }} MB"
          - "checkpoint_completion_target: {{ pg_checkpoint_completion_target }}"
          - "random_page_cost: {{ pg_random_page_cost }}"
          - "effective_io_concurrency: {{ pg_effective_io_concurrency }}"
          - "max_worker_processes: {{ pg_max_worker_processes }}"
          - "max_parallel_workers_per_gather: {{ pg_max_parallel_workers_per_gather }}"
          - "max_parallel_workers: {{ pg_max_parallel_workers }}"
          - "jit: {{ pg_jit }}"
          - "=========================================="

    - name: Set cluster facts
      set_fact:
        node_name: "{{ ansible_hostname }}"
        node_ip: "{{ ansible_default_ipv4.address }}"
        is_primary: "{{ inventory_hostname == groups['pg_nodes'][0] }}"

    - name: Display OS-specific paths
      debug:
        msg:
          - "OS Family: {{ ansible_os_family }}"
          - "Data dir: {{ data_dir }}"
          - "Bin dir: {{ pg_bin_dir }}"
          - "Service: {{ pg_service }}"

    # Enhanced Cleanup Section
    - name: Stop all related services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - patroni
        - "{{ pg_service }}"
      ignore_errors: true

    - name: Remove the PostgreSQL cluster (Debian/Ubuntu - pg_dropcluster)
      ansible.builtin.shell: |
        sudo pg_dropcluster {{ pg_version }} "{{ patroni_scope }}"
      ignore_errors: true
      when: ansible_os_family == "Debian"

    - name: Remove the PostgreSQL cluster (RHEL/CentOS - remove data dir)
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: absent
        force: yes
      ignore_errors: true
      when: ansible_os_family == "RedHat"

    # PostgreSQL Initialization - ONLY ON PRIMARY
    - name: Create PostgreSQL cluster using pg_createcluster on primary node only (Debian/Ubuntu)
      ansible.builtin.command: sudo pg_createcluster {{ pg_version }} {{ patroni_scope }} -d {{ data_dir }}
      when: ansible_os_family == "Debian" and is_primary

    # Stop the PostgreSQL cluster
    - name: Stop the PostgreSQL cluster (Debian/Ubuntu)
      ansible.builtin.shell: |
        sudo /usr/bin/pg_ctlcluster "{{ pg_version }}-{{ patroni_scope }}" stop
      ignore_errors: true
      when: ansible_os_family == "Debian"

    - name: Stop the PostgreSQL cluster (RHEL/CentOS)
      ansible.builtin.systemd:
        name: "{{ pg_service }}"
        state: stopped
      ignore_errors: true
      when: ansible_os_family == "RedHat"

    - name: Remove all configuration and data files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
        force: yes
      loop:
        - /etc/patroni/patroni.yml
        - /etc/patroni/patroni.yaml
        - /etc/systemd/system/patroni.service
        - "{{ data_dir }}"
        - "{{ base_data_dir }}"
        - /postgres/pgbackup/*
        - /var/lib/postgresql/12/*
        - /var/run/postgresql/*
      ignore_errors: yes

    - name: Ensure data directory is empty
      ansible.builtin.stat:
        path: "{{ data_dir }}"
      register: data_dir_stat

    - name: Remove data directory if it exists
      ansible.builtin.command: rm -rf {{ data_dir }}
      when: data_dir_stat.stat.exists

    # Enhanced ETCD Cleanup
    - name: Perform complete ETCD cleanup
      ansible.builtin.shell: |
        for key in \
          "/{{ dcs_namespace }}/{{ patroni_scope }}" \
          "/{{ dcs_namespace }}/{{ patroni_scope }}/leader" \
          "/{{ dcs_namespace }}/{{ patroni_scope }}/system_id" \
          "/{{ dcs_namespace }}/{{ patroni_scope }}/initialize" \
          "/{{ dcs_namespace }}/{{ patroni_scope }}/members" \
          "/{{ dcs_namespace }}/{{ patroni_scope }}/config"
        do
          /usr/bin/etcdctl --endpoints="{{ etcd_client_endpoints }}" del "$key" --prefix
        done
      ignore_errors: yes

    # Verification of Cleanup
    - name: Verify cleanup
      block:
        - name: Check data directory is empty
          ansible.builtin.stat:
            path: "{{ data_dir }}"
          register: data_dir_stat

        - name: Check ETCD keys
          ansible.builtin.shell: "etcdctl --endpoints='{{ etcd_client_endpoints }}' get '/{{ dcs_namespace }}/{{ scope }}' --prefix | wc -l"
          register: etcd_keys
          ignore_errors: yes

        - name: Display cleanup status
          ansible.builtin.debug:
            msg:
              - "Data directory exists: {{ data_dir_stat.stat.exists }}"
              - "ETCD keys found: {{ etcd_keys.stdout | default('0') | int }}"

    - name: Wait for cleanup to settle
      ansible.builtin.pause:
        seconds: 10

    # Directory Setup
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ base_data_dir }}", mode: '0755' }
        - { path: "{{ data_dir }}", mode: '0700' }
        - { path: "/postgres/pgbackup/{{ patroni_scope }}/archive", mode: '0700' }
        - { path: "/etc/patroni", mode: '0755' }
        - { path: "{{ pg_socket_dir }}", mode: '0755' }
        - { path: "/var/log/patroni", mode: '0755' }

    # ============================================================
    # RESILIENCE: PostgreSQL data must survive reboots - refuse tmpfs/ramfs.
    # ============================================================
    - name: Detect filesystem type of PostgreSQL data directory
      ansible.builtin.shell: "findmnt -n -o FSTYPE --target {{ base_data_dir }} | tr -d '\\n'"
      register: pg_data_fs
      changed_when: false

    - name: Refuse volatile storage for PostgreSQL data (would lose all data on reboot)
      ansible.builtin.fail:
        msg: >-
          PostgreSQL data dir ({{ base_data_dir }}) is on {{ pg_data_fs.stdout }} (volatile).
          Move it to persistent disk - a reboot would destroy the database.
      when: pg_data_fs.stdout in ['tmpfs', 'ramfs']

    # ============================================================
    # RESILIENCE: softdog kernel watchdog - self-fencing for a partitioned
    # primary. Patroni feeds /dev/watchdog; if it loses DCS quorum it stops
    # feeding and the kernel reboots the host (STONITH-style fencing).
    # ============================================================
    - name: Load softdog kernel module (Patroni self-fencing)
      ansible.builtin.command: modprobe softdog
      register: softdog_modprobe
      changed_when: false
      failed_when: softdog_modprobe.rc != 0
      when: patroni_watchdog | default(true)

    - name: Persist softdog module load across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/softdog.conf
        content: |
          softdog
      when: patroni_watchdog | default(true)

    - name: Give postgres write access to the watchdog device (udev rule)
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-watchdog.rules
        content: |
          KERNEL=="watchdog*", MODE="0666"
      when: patroni_watchdog | default(true)

    - name: Apply watchdog udev rule and permissions
      ansible.builtin.shell: |
        udevadm control --reload-rules && udevadm trigger
        chmod 666 /dev/watchdog 2>/dev/null || true
      when: patroni_watchdog | default(true)
      changed_when: false

    - name: Verify watchdog device is available
      ansible.builtin.shell: ls -l /dev/watchdog
      register: watchdog_dev
      changed_when: false
      ignore_errors: true
      when: patroni_watchdog | default(true)

    - name: Display watchdog device
      ansible.builtin.debug:
        var: watchdog_dev.stdout
      when: patroni_watchdog | default(true) and watchdog_dev.stdout is defined

    - name: Create Patroni configuration file
      ansible.builtin.blockinfile:
        path: "/etc/patroni/patroni.yml"
        create: yes
        mode: '0644'
        owner: postgres
        group: postgres
        block: |
          dcs_namespace: {{ dcs_namespace }}
          scope: {{ scope }}
          name: {{ node_name }}

          restapi:
              listen: 0.0.0.0:8008
              connect_address: {{ node_ip }}:8008

          etcd3:
              # All etcd endpoints, not just the local one: DCS access survives
              # a local etcd failure (client-side redundancy).
              hosts: {{ etcd_client_endpoints }}

          {% if patroni_watchdog | default(true) %}
          # Self-fencing: if this Patroni loses DCS quorum / becomes partitioned,
          # it stops feeding the kernel watchdog (softdog) and the host is
          # rebooted - preventing a stale primary from accepting writes
          # (split-brain protection).
          watchdog:
              mode: automatic
              device: /dev/watchdog
              safety_margin: 5
          {% endif %}

          bootstrap:
            dcs:
                ttl: 30
                loop_wait: 10
                retry_timeout: 10
                maximum_lag_on_failover: 1048576

                postgresql:
                    use_pg_rewind: true
                    use_slots: true
                    parameters:
                        # --- PG TUNE CALCULATED PARAMETERS ---
                        shared_buffers: "{{ pg_shared_buffers_mb }}MB"
                        effective_cache_size: "{{ pg_effective_cache_size_mb }}MB"
                        maintenance_work_mem: "{{ pg_maintenance_work_mem_mb }}MB"
                        work_mem: "{{ pg_work_mem_kb }}kB"
                        max_connections: {{ pg_max_connections }}
                        wal_buffers: "{{ pg_wal_buffers_kb }}kB"
                        min_wal_size: "{{ pg_min_wal_size_mb }}MB"
                        max_wal_size: "{{ pg_max_wal_size_mb }}MB"
                        checkpoint_completion_target: {{ pg_checkpoint_completion_target }}
                        random_page_cost: {{ pg_random_page_cost }}
                        effective_io_concurrency: {{ pg_effective_io_concurrency }}
                        max_worker_processes: {{ pg_max_worker_processes }}
                        max_parallel_workers_per_gather: {{ pg_max_parallel_workers_per_gather }}
                        max_parallel_workers: {{ pg_max_parallel_workers }}
                        parallel_leader_participation: on
                        jit: {{ pg_jit }}
                        # --- REPLICATION SETTINGS ---
                        wal_level: replica
                        hot_standby: "on"
                        max_wal_senders: 10
                        max_replication_slots: 20
                        wal_log_hints: "on"
                        wal_keep_size: "1GB"
                        # --- LOGGING ---
                        logging_collector: 'on'
                        log_destination: 'stderr'
                        log_min_duration_statement: 1000
                        log_checkpoints: on
                        log_connections: on
                        log_disconnections: on
                        log_lock_waits: on
                        log_temp_files: 0
                        log_autovacuum_min_duration: 0
                        # --- AUTOVACUUM ---
                        autovacuum: 'on'
                        autovacuum_max_workers: 3
                        autovacuum_naptime: 30s
                        autovacuum_vacuum_threshold: 50
                        autovacuum_analyze_threshold: 50
                        autovacuum_vacuum_scale_factor: 0.1
                        autovacuum_analyze_scale_factor: 0.05
                        # --- ARCHIVE ---
                        # No-pgBackRest default: archiving is OFF. Without
                        # pgBackRest nothing consumes the local archive, so WAL
                        # would pile up forever with no cleanup (disk-bloat
                        # risk) and no PITR benefit (no base backups to restore
                        # to). Patroni HA (streaming + pg_rewind) does not need
                        # archiving. If 05_Configure_Pgbackrest.yml is run, it
                        # re-enables archive_mode and sets the pgbackrest
                        # archive-push/archive-get commands.
                        archive_mode: "off"
                        archive_timeout: 600s

            initdb:
                - encoding: UTF8
                - data-checksums

            pg_hba:
                - host replication replicator 127.0.0.1/32 trust
                - host replication replicator 0.0.0.0/0 scram-sha-256
                - host all all 0.0.0.0/0 scram-sha-256
                - host all all ::0/0 scram-sha-256

            users:
                admin:
                    password: "{{ patroni_admin_password }}"
                    options:
                        - createrole
                        - createdb
                percona:
                    password: "{{ percona_password }}"
                    options:
                        - createrole
                        - createdb
                pgpool:
                    password: "{{ pgpool_password }}"
                    options:
                        - createrole
                        - createdb

          postgresql:
              cluster_name: "{{ cluster_name }}"
              listen: 0.0.0.0:5432
              connect_address: {{ node_ip }}:5432
              data_dir: {{ data_dir }}
              bin_dir: {{ pg_bin_dir }}
              pgpass: /tmp/pgpass0
              authentication:
                  replication:
                      username: "{{ replicator_username }}"
                      password: "{{ replicator_password }}"
                  superuser:
                      username: postgres
                      password: "{{ postgres_password }}"
              parameters:
                  unix_socket_directories: "{{ pg_socket_dir }}"
              create_replica_methods:
                  - basebackup
              basebackup:
                  checkpoint: 'fast'
              # Active switchover signal: on promotion, immediately tell
              # pgpool (pcp_promote_node on every pgpool node) instead of
              # waiting for sr_check polling to notice the role change
              # (~4 min gap observed 2026-08-11). See files/pgpool_role_signal.sh.
              # NOTE: Patroni (this build) reads callbacks from the
              # postgresql: subsection (Postgresql.callback -> ConfigHandler
              # over config['postgresql']), NOT from the top level.
              callbacks:
                  on_role_change: /usr/local/sbin/pgpool_role_signal.sh

          tags:
              nofailover: false
              noloadbalance: false
              clonefrom: false
              nosync: false

    - name: Pause for Patroni to settle
      ansible.builtin.pause:
        seconds: 10

    - name: Validate Patroni configuration
      ansible.builtin.command: patroni --validate-config /etc/patroni/patroni.yml

    # ============================================================
    # RESILIENCE: Patroni must not start before etcd is reachable.
    # ExecStartPre waits for at least one healthy etcd endpoint so a
    # reboot never leaves Patroni in a "gave up on DCS" state.
    # ============================================================
    - name: Deploy etcd health wait script (Patroni ExecStartPre)
      ansible.builtin.copy:
        dest: /usr/local/sbin/wait_for_etcd.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Wait until at least one etcd endpoint accepts connections before
          # starting Patroni. Dependency-free TCP probe (no etcdctl/curl needed).
          ENDPOINTS="$1"
          [ -z "$ENDPOINTS" ] && ENDPOINTS="{{ etcd_client_endpoints }}"
          TIMEOUT={{ etcd_wait_timeout | default(90) }}

          wait_for_etcd() {
            local ep host port
            for ep in $(echo "$ENDPOINTS" | tr ',' ' '); do
              host="${ep%:*}"
              port="${ep##*:}"
              if timeout 2 bash -c "</dev/tcp/$host/$port" 2>/dev/null; then
                return 0
              fi
            done
            return 1
          }

          for i in $(seq 1 "$TIMEOUT"); do
            if wait_for_etcd; then
              echo "$(date): etcd reachable via $ENDPOINTS after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "ERROR: etcd not reachable after ${TIMEOUT}s (endpoints: $ENDPOINTS)" >&2
          exit 1

    # ============================================================
    # SWITCHOVER SIGNAL: Patroni on_role_change callback.
    # On promotion, immediately tell every pgpool node via
    # pcp_promote_node - closing the ~4 min clean-switchover
    # detection gap (see files/pgpool_role_signal.sh).
    # ============================================================
    - name: Deploy pgpool role-signal callback script
      ansible.builtin.copy:
        src: files/pgpool_role_signal.sh
        dest: /usr/local/sbin/pgpool_role_signal.sh
        owner: postgres
        group: postgres
        mode: '0755'

    # Systemd Setup
    - name: Create Patroni systemd service
      ansible.builtin.blockinfile:
        path: "/etc/systemd/system/patroni.service"
        create: yes
        mode: '0644'
        owner: root
        group: root
        block: |
          [Unit]
          Description=Runners to orchestrate a high-availability PostgreSQL
          After=syslog.target network-online.target etcd.service
          Wants=network-online.target
          {% if etcd_group is not defined or etcd_group | length == 0 %}
          # etcd is co-located on this node - hard ordering dependency.
          Requires=etcd.service
          {% endif %}

          [Service]
          Type=simple
          User=postgres
          Group=postgres
          ExecStartPre=/usr/local/sbin/wait_for_etcd.sh
          ExecStart={{ '/usr/bin/patroni' if ansible_os_family == 'RedHat' else '/bin/patroni' }} /etc/patroni/patroni.yml
          ExecReload=/bin/kill -s HUP $MAINPID
          KillMode=process
          TimeoutSec=30
          Restart=on-failure
          RestartSec=15s
          # Never let systemd give up on Patroni - it must retry forever
          # (DCS might come back; a crashed member should self-heal).
          StartLimitIntervalSec=0

          [Install]
          WantedBy=multi-user.target

    # Service Management - Starting in the right order
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes

    # Start primary first
    - name: Start Patroni on primary node
      ansible.builtin.systemd:
        name: patroni
        state: started
        enabled: yes
      when: is_primary

    - name: Wait for primary to initialize
      ansible.builtin.pause:
        seconds: 10
      when: is_primary

    # Then start secondaries
    - name: Start Patroni on replica nodes
      ansible.builtin.systemd:
        name: patroni
        state: started
        enabled: yes
      when: not is_primary

    - name: Create patronictl alias
      ansible.builtin.blockinfile:
        path: /etc/profile.d/patroni-alias.sh
        create: yes
        mode: '0644'
        block: |
          alias patronictl='patronictl -c /etc/patroni/patroni.yml'

    # Final Verification
    - name: Wait for cluster to stabilize
      ansible.builtin.pause:
        seconds: 15

    - name: Check cluster status
      ansible.builtin.shell: patronictl -c /etc/patroni/patroni.yml list
      register: cluster_status
      ignore_errors: yes

    - name: Display cluster status
      ansible.builtin.debug:
        var: cluster_status.stdout_lines